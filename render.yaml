# Render Blueprint for the Contexa API (docs/DEPLOY.md). The web app goes to Vercel.
# Secrets are marked `sync: false`: Render asks for them when the Blueprint is created.
services:
  - type: web
    name: contexa-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    # Only the API's own files trigger a redeploy.
    buildFilter:
      include:
        - apps/api/**
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_API_KEY
        sync: false
      # The Vercel production URL, e.g. https://contexa.vercel.app (comma-separated for more).
      - key: CORS_ORIGINS
        sync: false
      # Optional: meeting history (Supabase session pooler connection string).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
