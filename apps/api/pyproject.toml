[project]
name = "contexa-api"
version = "0.1.0"
description = "Contexa backend: AssemblyAI streaming tokens, final-turn translation, question detection, and grounded answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "python-multipart>=0.0.32",
    "pypdf>=6.19",
    "python-docx>=1.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
